# Shared project settings for BBBC042 astrocyte center detection.
# TODO [Team]: confirm values using actual data, validation results and hardware.

project:
  name: Astrocyte_Detection
  seed: 42

data:
  root: datasets/BBBC042
  images_dir: datasets/BBBC042/images
  annotations_dir: datasets/BBBC042/positions
  # TODO [Zhang]: verify image filename <-> annotation filename mapping.
  # TODO [Zhang]: confirm whether coordinates are (x,y) or (row,column), and index origin.
  input_channels: 1  # TODO [Zhu]: confirm GFAP/channel choice and normalization.
  channel: null  # Fluorescence channel index for multi-channel images; null = single-channel/RGB behavior.
  masks_dir: null  # Optional expert masks: <stem>_semantic.tif + <stem>_instance.tif (full supervision).
  soma_radius_pixels: 5.0  # Point supervision: disk around each point labeled soma(1).
  background_distance_pixels: 16.0  # Beyond this distance: confident background; ring in between is ignored.
  image_size: [256, 256]  # Training crop; val/test use deterministic full-coverage crops.
  train_fraction: 0.70
  val_fraction: 0.15
  test_fraction: 0.15
  # TODO [Team]: split by source/slide where relevant to avoid leakage.

heatmap:
  sigma_pixels: 3.0  # TODO [Zhang]: tune according to cell size and image scale.
  # TODO [Zhang]: implement Gaussian heatmap from verified point annotations.

model:
  architecture: unet
  encoder: resnet18
  encoder_weights: null
  output_channels: 4  # REDESIGN: 3 semantic classes (bg/soma/process) + 1 center channel.
  # Model returns raw logits (no final softmax/sigmoid during training).

training:
  device: cuda  # NVIDIA GPU required for training; no silent CPU fallback.
  batch_size: 8  # TODO [Liu]: adjust to available GPU memory.
  epochs: 50  # TODO [Liu]: decide training budget and early stopping.
  learning_rate: 0.0001
  optimizer: adam
  loss: bce_with_logits  # TODO [Liu]: evaluate suitability for sparse heatmaps.
  num_workers: 0  # TODO [Liu]: tune on training machine.
  checkpoint_dir: checkpoints

inference:
  threshold: 0.5  # TODO [Liu]: tune on validation set, not test set.
  min_distance_pixels: 5  # TODO [Zhang]: tune based on center spacing.
  tile_size: 512  # Whole-slide tile size in selected-level pixels.
  overlap_pixels: 64  # Tile overlap; duplicate centers are deduplicated globally.
  level: 0  # QPTIFF resolution level used for inference and stitched masks.
  mask_pixel_budget: 100000000  # Above this, skip full masks and warn; points/CSV remain available.

baseline:
  model: cpsam  # TODO [Zhang]: verify Cellpose version/API and model availability.
  # TODO [Team]: match input preprocessing and evaluation split fairly.

evaluation:
  match_radius_pixels: 8  # TODO [Liu, Zhu]: justify using annotation uncertainty and pixel scale.
  # TODO [Liu]: one-to-one matching, precision/recall/F1 and count MAE.

ffpe:
  enabled: false
  # TODO [Zhu]: confirm channels, image scale, annotations and QC criteria.
  # TODO [Zhang]: add tiled QPTIFF inference and global-coordinate deduplication.
