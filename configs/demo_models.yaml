      soma: 1
      process: 2
    deployment:
      cloud_enabled: true
      checkpoint_url_env: ASTROCYTE_UNET_V2_CHECKPOINT_URL
      config_url_env: ASTROCYTE_UNET_V2_CONFIG_URL
      checkpoint_sha256: de8b49e0ec570a0271bca3278b3364e9cbf47b50ff85672df89180b3c16abd0e
      checkpoint_size_bytes: 172041227
      config_sha256: e3ff4f6f1cb7dd835c09034700bbe58691f8531009a24c4418786e27b2d79eb9
      config_size_bytes: 2239
